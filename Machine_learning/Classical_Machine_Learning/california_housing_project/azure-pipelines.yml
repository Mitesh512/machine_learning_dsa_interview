trigger:
  branches:
    include:
    - main
    - develop

variables:
  python.version: '3.8'

stages:
- stage: Test
  jobs:
  - job: RunTests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'
    - script: |
        pip install pytest pytest-cov
        pytest tests --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-report=xml
      displayName: 'Run tests'
    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Python $(python.version)'
    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'

- stage: Train
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: TrainModel
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
    - task: AzureMLCompute@1
      inputs:
        azureSubscription: 'Your-Azure-Subscription'
        mlWorkspaceName: 'Your-ML-Workspace'
        experimentName: 'california-housing-training'
        modelName: 'california-housing-model'
    - script: |
        python src/training/train.py
      displayName: 'Train Model'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/models'
        artifact: 'model-artifacts'
        publishLocation: 'pipeline'

- stage: Deploy
  dependsOn: Train
  condition: succeeded()
  jobs:
  - deployment: DeployModel
    pool:
      vmImage: 'ubuntu-latest'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'Your-Azure-Subscription'
              appName: 'your-webapp-name'
              package: '$(Pipeline.Workspace)/model-artifacts'
